<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1923">
<title>KinéScope — Espace Patient</title>
<style>
:root{--bg:#0F1923;--surf:#16222E;--surf2:#1E2F40;--surf3:#243647;--tx:#E8EDF2;--tx2:#8FA3B4;--tx3:#5A7080;--acc:#2DD4BF;--acc2:#0EA5E9;--red:#F87171;--brd:#243647;--r:12px;--rs:8px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);overflow:hidden;}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s;}
.screen.active{opacity:1;pointer-events:all;}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;}
.spin{width:36px;height:36px;border:3px solid var(--surf3);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--safe-b) + 24px);left:50%;transform:translateX(-50%) translateY(16px);background:#1E2F40;border:1.5px solid var(--brd);border-radius:20px;padding:10px 20px;font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;opacity:0;transition:all .25s;pointer-events:none;z-index:1000;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── CARD ── */
.card{width:100%;max-width:340px;padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:20px;}

/* ── LOGO ── */
.pat-logo{width:72px;height:72px;background:linear-gradient(135deg,#C4621D,#E07B2A);border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(196,98,29,.35);}
.pat-title{font-size:26px;font-weight:800;letter-spacing:-.5px;}
.pat-sub{font-size:14px;color:var(--tx2);text-align:center;line-height:1.55;max-width:260px;}

/* ── PIN ── */
.pin-dots{display:flex;gap:14px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--tx3);transition:all .15s;}
.pin-dot.filled{background:var(--acc);border-color:var(--acc);}
.pin-dot.error{background:var(--red);border-color:var(--red);}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:260px;}
.pinkey{background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--r);height:62px;font-size:22px;font-weight:600;color:var(--tx);font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .08s,transform .08s;}
.pinkey:active,.pinkey.tapped{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important;transform:scale(.88)!important;}
.pinkey.del{font-size:16px;color:var(--tx2);}
.pinkey.empty{background:transparent;border-color:transparent;pointer-events:none;}
.pin-error{font-size:13px;color:var(--red);font-weight:600;text-align:center;min-height:18px;}

/* ── DDN ── */
.ddn-inp{width:100%;max-width:260px;background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--rs);padding:14px;font-size:18px;color:var(--tx);font-family:var(--font);outline:none;-webkit-appearance:none;text-align:center;color-scheme:dark;}
.ddn-inp:focus{border-color:var(--acc);}
.btn-confirm{background:var(--acc);color:#0F1923;border:none;border-radius:var(--r);padding:14px 32px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;width:100%;max-width:260px;transition:opacity .1s;}
.btn-confirm:active{opacity:.85;}
.btn-back{background:none;border:none;color:var(--tx3);font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;padding:10px 16px;}
.ddn-error{font-size:13px;color:var(--red);text-align:center;display:none;}
.ddn-error.show{display:block;}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><p style="color:var(--tx2);font-size:14px">Chargement&#8230;</p></div>
<div class="toast" id="toast"></div>

<!-- ━━━━━━ ÉCRAN PIN ━━━━━━ -->
<div class="screen" id="sc-pin">
  <div class="card">
    <div class="pat-logo">
      <svg viewBox="0 0 24 24" fill="none" width="32" height="32">
        <circle cx="12" cy="8" r="4" fill="white" fill-opacity=".9"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="pat-title">Mon programme</div>
    <div class="pat-sub">Entrez votre code patient &#224; 4 chiffres</div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot"></div><div class="pin-dot"></div>
      <div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div class="pinpad">
      <button class="pinkey" onclick="pk(1)">1</button><button class="pinkey" onclick="pk(2)">2</button><button class="pinkey" onclick="pk(3)">3</button>
      <button class="pinkey" onclick="pk(4)">4</button><button class="pinkey" onclick="pk(5)">5</button><button class="pinkey" onclick="pk(6)">6</button>
      <button class="pinkey" onclick="pk(7)">7</button><button class="pinkey" onclick="pk(8)">8</button><button class="pinkey" onclick="pk(9)">9</button>
      <button class="pinkey empty"></button><button class="pinkey" onclick="pk(0)">0</button><button class="pinkey del" onclick="pkdel()">&#9003;</button>
    </div>
    <div class="pin-error" id="pin-error"></div>
  </div>
</div>

<!-- ━━━━━━ ÉCRAN DDN ━━━━━━ -->
<div class="screen" id="sc-ddn">
  <div class="card" style="gap:18px;">
    <div class="pat-logo">
      <svg viewBox="0 0 24 24" fill="none" width="28" height="28">
        <rect x="3" y="4" width="18" height="18" rx="3" stroke="white" stroke-width="2"/>
        <path d="M3 9h18M8 2v4M16 2v4" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="pat-title">V&#233;rification</div>
    <div class="pat-sub">Confirmez votre date de naissance pour acc&#233;der &#224; votre programme.</div>
    <input type="date" class="ddn-inp" id="ddn-inp">
    <div class="ddn-error" id="ddn-error">Date incorrecte, r&#233;essayez.</div>
    <button class="btn-confirm" onclick="confirmDDN()">Confirmer &#8594;</button>
    <button class="btn-back" onclick="backToPin()">&#8592; Retour</button>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const FB={apiKey:"AIzaSyBxb76bIaud6w8iE4dZL2x_XGaUeDDImMc",authDomain:"kinescope-9df37.firebaseapp.com",projectId:"kinescope-9df37",storageBucket:"kinescope-9df37.firebasestorage.app",messagingSenderId:"279167842820",appId:"1:279167842820:web:86e0bf2f726fbaee531351"};
const app=initializeApp(FB);
const db=getFirestore(app);

// ── STATE ──
const S={pinBuf:"",found:null};

// ── UTILS ──
function hideLoad(){document.getElementById("loading").style.display="none";}
function showLoad(){document.getElementById("loading").style.display="flex";}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400);}
window.ss=id=>{document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));const el=document.getElementById(id);if(el)el.classList.add("active");};

function updots(n,err=false){
  document.querySelectorAll("#pin-dots .pin-dot").forEach((d,i)=>{
    d.classList.toggle("filled",!err&&i<n);
    d.classList.toggle("error",err);
  });
}

// ── PIN ──
window.pk=d=>{
  if(S.pinBuf.length>=4)return;
  S.pinBuf+=String(d);
  updots(S.pinBuf.length);
  if(navigator.vibrate)navigator.vibrate(8);
  if(S.pinBuf.length===4)setTimeout(lookupPin,120);
};
window.pkdel=()=>{
  S.pinBuf=S.pinBuf.slice(0,-1);
  updots(S.pinBuf.length);
  document.getElementById("pin-error").textContent="";
};

// ── LOOKUP dans global_access ──
async function lookupPin(){
  showLoad();
  try{
    const snap=await getDoc(doc(db,"global_access",S.pinBuf));
    hideLoad();
    if(snap.exists()){
      S.found=snap.data(); // {uid_kine, patient_id, ddn}
      // Passer &#224; la v&#233;rification DDN
      document.getElementById("ddn-inp").value="";
      document.getElementById("ddn-error").classList.remove("show");
      ss("sc-ddn");
    }else{
      // PIN inconnu : afficher erreur, rester sur l'&#233;cran
      updots(4,true);
      document.getElementById("pin-error").textContent="Code erron&#233;";
      if(navigator.vibrate)navigator.vibrate([40,30,40]);
      setTimeout(()=>{S.pinBuf="";updots(0);document.getElementById("pin-error").textContent="";},700);
    }
  }catch(e){
    hideLoad();
    console.error("[lookupPin]",e.code,e.message);
    document.getElementById("pin-error").textContent="Erreur r&#233;seau, r&#233;essayez.";
    setTimeout(()=>{S.pinBuf="";updots(0);document.getElementById("pin-error").textContent="";},1500);
  }
}

// ── DDN ──
window.backToPin=()=>{S.pinBuf="";updots(0);S.found=null;ss("sc-pin");};

window.confirmDDN=()=>{
  const val=document.getElementById("ddn-inp").value;
  if(!val){showToast("Entrez votre date de naissance");return;}
  const f=S.found;if(!f){ss("sc-pin");return;}
  const norm=s=>(s||"").replace(/\//g,"-").trim();
  if(norm(f.ddn)===norm(val)){
    // Auth r&#233;ussie &#8594; vers patients.html en mode patient
    window.location.href="patients.html?mode=patient&pid="+f.patient_id+"&uid="+encodeURIComponent(f.uid_kine);
  }else{
    document.getElementById("ddn-error").classList.add("show");
    if(navigator.vibrate)navigator.vibrate([40,30,40]);
  }
};

// ── START ──
hideLoad();
ss("sc-pin");

// ── TAP FEEDBACK ──
(function(){
  const CLASSES=[".pinkey",".btn-confirm"];
  function addTap(el){
    if(el._tapDone)return;el._tapDone=true;
    el.addEventListener("touchstart",function(){this.classList.add("tapped");},{passive:true});
    el.addEventListener("touchend",function(){setTimeout(()=>this.classList.remove("tapped"),180);},{passive:true});
    el.addEventListener("touchcancel",function(){this.classList.remove("tapped");},{passive:true});
  }
  function scan(){CLASSES.forEach(sel=>document.querySelectorAll(sel).forEach(addTap));}
  document.addEventListener("DOMContentLoaded",scan);
  setTimeout(scan,300);
})();
</script>
</body>
</html>
