<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1923">
<title>Patients · KinéScope</title>
<style>
:root{
  --bg:#0F1923;--surf:#16222E;--surf2:#1E2F40;--surf3:#243647;
  --tx:#E8EDF2;--tx2:#8FA3B4;--tx3:#5A7080;
  --acc:#2DD4BF;--acc2:#0EA5E9;--acc3:#F59E0B;
  --red:#F87171;--green:#34D399;
  --brd:#243647;--r:14px;--rs:10px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);overflow:hidden;}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .22s;}
.screen.active{opacity:1;pointer-events:all;}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px;}
.spin{width:36px;height:36px;border:3px solid var(--surf3);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

/* HDR */
.hdr{flex-shrink:0;padding:calc(var(--safe-t)+14px) 16px 14px;background:var(--bg);border-bottom:1px solid var(--brd);display:flex;flex-direction:column;gap:12px;}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hdr-back{background:none;border:none;color:var(--tx2);font-size:14px;font-family:var(--font);cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 0;}
.hdr-back:active{color:var(--acc);}
.btn-add{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:var(--rs);padding:10px 16px;font-size:13px;font-weight:700;color:#fff;font-family:var(--font);cursor:pointer;display:flex;align-items:center;gap:7px;box-shadow:0 4px 18px rgba(45,212,191,.3);transition:transform .1s;flex-shrink:0;}
.btn-add:active{transform:scale(.95);}

/* SEARCH */
.search-wrap{position:relative;}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none;}
#search-input{width:100%;background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--rs);padding:12px 40px 12px 42px;font-size:15px;color:var(--tx);font-family:var(--font);outline:none;-webkit-appearance:none;transition:border-color .15s;}
#search-input:focus{border-color:var(--acc);}
#search-input::placeholder{color:var(--tx3);}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--surf3);border:none;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx2);font-size:13px;opacity:0;transition:opacity .15s;}
.search-clear.show{opacity:1;}

/* LISTE */
#sc-list{background:var(--bg);}
.list-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--safe-b)+80px);}
.list-count{font-size:11px;color:var(--tx3);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;}
.pat-card{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r);padding:16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color .15s,transform .1s;}
.pat-card:active{transform:scale(.98);border-color:var(--acc);}
.pat-avatar{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0;}
.pat-info{flex:1;min-width:0;}
.pat-name{font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pat-meta{font-size:12px;color:var(--tx2);margin-top:3px;}
.pat-chip{background:var(--surf3);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--tx2);flex-shrink:0;}
.pat-chip.green{background:rgba(52,211,153,.15);color:var(--green);}
.empty-state{text-align:center;padding:60px 24px;}
.empty-icon{font-size:48px;margin-bottom:16px;}
.empty-title{font-size:17px;font-weight:700;margin-bottom:8px;}
.empty-sub{font-size:13px;color:var(--tx2);line-height:1.5;}

/* PROFIL */
#sc-profil{background:var(--bg);}
.profil-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--safe-b)+40px);}
.profil-hero{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r);padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:16px;}
.profil-avatar{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex-shrink:0;}
.profil-nom{font-size:19px;font-weight:800;line-height:1.2;}
.profil-meta{font-size:12px;color:var(--tx2);margin-top:4px;line-height:1.5;}
.profil-pin{display:inline-flex;align-items:center;gap:5px;background:var(--surf3);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--acc);margin-top:6px;}

/* ACTIONS RAPIDES */
.actions-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.btn-action{background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--font);transition:border-color .15s,transform .1s;}
.btn-action:active{transform:scale(.97);}
.btn-action.primary{background:linear-gradient(135deg,rgba(45,212,191,.1),rgba(14,165,233,.06));border-color:rgba(45,212,191,.35);}
.btn-action-icon{font-size:22px;}
.btn-action-lbl{font-size:13px;font-weight:700;color:var(--tx);}
.btn-action-sub{font-size:10px;color:var(--tx2);}
.sec-label{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;}

/* ═══════════════════════════════════════
   TIMELINE — design avec ligne verticale
═══════════════════════════════════════ */
.timeline-wrap{position:relative;padding-left:28px;margin-bottom:32px;}
/* Ligne verticale continue */
.timeline-wrap::before{content:'';position:absolute;left:10px;top:6px;bottom:6px;width:2px;background:linear-gradient(to bottom,var(--brd),transparent);border-radius:1px;}

/* BILAN PARENT */
.tl-bilan{margin-bottom:6px;}
.tl-bilan-card{
  position:relative;background:var(--surf);border:1.5px solid var(--brd);
  border-radius:var(--r);padding:16px;cursor:pointer;
  transition:border-color .2s,transform .1s;
}
.tl-bilan-card:active{transform:scale(.99);}
.tl-bilan-card.expanded{border-color:rgba(45,212,191,.35);border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent;}
/* Pastille sur la ligne */
.tl-bilan::before{content:'';position:absolute;left:-22px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--surf3);border:2px solid var(--brd);z-index:1;}
.tl-bilan-hdr{display:flex;align-items:center;gap:12px;}
.tl-dot{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.tl-bilan-info{flex:1;min-width:0;}
.tl-bilan-name{font-size:14px;font-weight:700;}
.tl-bilan-date{font-size:11px;color:var(--tx3);margin-top:2px;}
.tl-bilan-scores{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.score-chip{background:var(--surf3);border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;color:var(--tx2);}
.score-chip.good{background:rgba(52,211,153,.15);color:var(--green);}
.score-chip.warn{background:rgba(245,158,11,.15);color:var(--acc3);}
.score-chip.bad{background:rgba(248,113,113,.15);color:var(--red);}
.tl-chevron{color:var(--tx3);font-size:16px;transition:transform .22s;flex-shrink:0;}
.tl-bilan-card.expanded .tl-chevron{transform:rotate(90deg);}

/* ZONE DÉTAIL (expand) */
.tl-detail{
  background:var(--surf);border:1.5px solid rgba(45,212,191,.35);
  border-top:none;border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r);
  overflow:hidden;max-height:0;transition:max-height .3s cubic-bezier(.4,0,.2,1);
}
.tl-detail.open{max-height:1200px;}
.tl-detail-inner{padding:12px 16px 16px;}
.tl-scores-title{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;}

/* LIGNE DE SCORE RÉÉVALUABLE */
.score-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--brd);
}
.score-row:last-child{border-bottom:none;}
.score-row-left{flex:1;min-width:0;}
.score-row-name{font-size:12px;font-weight:700;color:var(--tx2);}
/* Fil d'évolution : valeurs successives avec flèches */
.score-evolution{display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:wrap;}
.score-val-init{font-size:15px;font-weight:800;color:var(--tx);}
.score-val-reeval{font-size:14px;font-weight:700;}
.score-arrow{font-size:11px;color:var(--tx3);}
/* Bouton réévaluer */
.btn-reeval{
  background:var(--surf3);border:1.5px solid var(--brd);border-radius:var(--rs);
  padding:7px 11px;font-size:11px;font-weight:700;color:var(--acc);
  font-family:var(--font);cursor:pointer;white-space:nowrap;flex-shrink:0;
  display:flex;align-items:center;gap:5px;transition:background .15s,transform .1s;
}
.btn-reeval:active{transform:scale(.93);background:rgba(45,212,191,.15);}

/* RÉÉVALS ENFANTS sous le bilan (arbre) */
.tl-reevals{padding-left:14px;border-left:2px solid rgba(45,212,191,.2);margin-top:4px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px;}
.tl-reeval-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.2);
  border-radius:20px;padding:4px 10px;font-size:11px;color:var(--tx2);
}
.tl-reeval-tag span{font-weight:700;color:var(--tx);}

/* EMPTY TIMELINE */
.tl-empty{background:var(--surf);border:1.5px dashed var(--brd);border-radius:var(--r);padding:28px;text-align:center;color:var(--tx3);font-size:13px;line-height:1.6;}

/* MODALS */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .22s;}
.ov.open{opacity:1;pointer-events:all;}
.sheet{background:var(--surf);border-radius:22px 22px 0 0;width:100%;max-width:520px;padding:0 0 calc(var(--safe-b)+16px);transform:translateY(24px);transition:transform .28s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow-y:auto;}
.ov.open .sheet{transform:translateY(0);}
.drag{width:36px;height:4px;background:var(--brd);border-radius:2px;margin:12px auto 16px;}
.sh-title{font-size:17px;font-weight:800;padding:0 20px;margin-bottom:6px;}
.sh-ref{font-size:12px;color:var(--tx3);padding:0 20px;margin-bottom:18px;}
.sh-body{padding:0 20px;}
.fl{font-size:12px;font-weight:700;color:var(--tx2);display:block;margin-bottom:6px;margin-top:14px;}
.fl:first-child{margin-top:0;}
.fi{width:100%;background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--rs);padding:14px;font-size:15px;color:var(--tx);font-family:var(--font);outline:none;-webkit-appearance:none;transition:border-color .15s;color-scheme:dark;}
.fi:focus{border-color:var(--acc);}
.fi-row{display:flex;gap:10px;}
.fi-row .fi{flex:1;}
.btn-row{display:flex;gap:10px;margin-top:18px;margin-bottom:6px;}
.btn-p{flex:1;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;border-radius:var(--r);padding:15px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;transition:transform .1s;box-shadow:0 4px 16px rgba(45,212,191,.2);}
.btn-p:active{transform:scale(.97);}
.btn-s{flex:1;background:var(--surf3);color:var(--tx2);border:1.5px solid var(--brd);border-radius:var(--r);padding:15px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;transition:transform .1s;}
.btn-s:active{transform:scale(.97);}
.err-msg{color:var(--red);font-size:12px;font-weight:600;margin-top:8px;display:none;}
.err-msg.show{display:block;}

/* BOTTOM SHEET RÉÉVAL */
.eva-big{font-size:52px;font-weight:900;text-align:center;color:var(--acc);line-height:1;margin:8px 0 4px;}
.eva-range-wrap{padding:6px 0 12px;}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:var(--surf3);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--acc);cursor:pointer;box-shadow:0 2px 10px rgba(45,212,191,.4);}
.range-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);}
.chips-grid{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:var(--surf3);border:1.5px solid var(--brd);border-radius:20px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);color:var(--tx2);transition:all .1s;}
.chip.sel{background:var(--acc);color:#0F1923;border-color:var(--acc);}
.groc-opt{background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--rs);padding:12px 14px;margin-bottom:7px;cursor:pointer;display:flex;align-items:center;gap:12px;font-family:var(--font);transition:border-color .15s,background .15s;}
.groc-opt:active,.groc-opt.sel{border-color:var(--acc);background:rgba(45,212,191,.08);}
.groc-opt-lbl{font-size:13px;font-weight:600;color:var(--tx);}
.groc-opt-sub{font-size:11px;color:var(--tx2);}

/* BILANS LIST (modal choix bilan) */
.bilan-opt{background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--rs);padding:13px 14px;margin-bottom:7px;cursor:pointer;display:flex;align-items:center;gap:12px;font-family:var(--font);transition:border-color .15s,transform .1s;}
.bilan-opt:active{transform:scale(.98);}
.bilan-dot-sm{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.bilan-opt-name{font-size:14px;font-weight:700;color:var(--tx);}
.bilan-opt-sub{font-size:11px;color:var(--tx2);}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--safe-b)+28px);left:50%;transform:translateX(-50%) translateY(10px);background:var(--surf3);color:var(--tx);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:9999;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><p style="color:var(--tx2);font-size:14px">Chargement...</p></div>

<!-- ══ ECRAN 1 : LISTE ══ -->
<div class="screen" id="sc-list">
  <div class="hdr">
    <div class="hdr-row">
      <button class="hdr-back" onclick="window.location.href='index.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        Dashboard
      </button>
      <button class="btn-add" onclick="openModal('ov-np')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        Ajouter un patient
      </button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <input type="search" id="search-input" placeholder="Rechercher un patient..." oninput="onSearch(this.value)" autocomplete="off" spellcheck="false">
      <button class="search-clear" id="search-clear" onclick="clearSearch()">x</button>
    </div>
  </div>
  <div class="list-scroll">
    <div class="list-count" id="list-count"></div>
    <div id="patients-list"></div>
  </div>
</div>

<!-- ══ ECRAN 2 : PROFIL ══ -->
<div class="screen" id="sc-profil">
  <div class="hdr" style="gap:0;">
    <div class="hdr-row">
      <button class="hdr-back" onclick="goBack()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        Patients
      </button>
      <button class="btn-add" onclick="openNewBilan()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        Nouveau bilan
      </button>
    </div>
  </div>
  <div class="profil-scroll">
    <div class="profil-hero">
      <div class="profil-avatar" id="profil-avatar"></div>
      <div style="flex:1;min-width:0;">
        <div class="profil-nom" id="profil-nom"></div>
        <div class="profil-meta" id="profil-meta"></div>
        <div class="profil-pin">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 11V7a4 4 0 018 0v4" stroke="currentColor" stroke-width="2"/></svg>
          <span id="profil-pin-val"></span>
        </div>
      </div>
    </div>

    <div class="sec-label">Bilans &amp; Réévaluations</div>
    <div class="timeline-wrap" id="timeline-wrap">
      <div class="tl-empty">Aucun bilan pour ce patient.<br>Commencez par créer un nouveau bilan.</div>
    </div>
  </div>
</div>

<!-- ══ MODAL : NOUVEAU PATIENT ══ -->
<div class="ov" id="ov-np" onclick="closeModal('ov-np')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="drag"></div>
    <div class="sh-title">Nouveau patient</div>
    <div class="sh-body">
      <div class="fi-row">
        <div style="flex:1;"><label class="fl" style="margin-top:0;">Prénom</label><input class="fi" type="text" id="np-prenom" placeholder="Marie" autocomplete="off"></div>
        <div style="flex:1;"><label class="fl" style="margin-top:0;">Nom</label><input class="fi" type="text" id="np-nom" placeholder="Dupont" autocomplete="off"></div>
      </div>
      <label class="fl">Date de naissance <span style="color:var(--red)">*</span></label>
      <input class="fi" type="date" id="np-ddn">
      <label class="fl">Motif de consultation</label>
      <input class="fi" type="text" id="np-motif" placeholder="ex: Lombalgie chronique" autocomplete="off">
      <label class="fl">Code patient (6 chiffres)</label>
      <div class="fi-row">
        <input class="fi" type="text" inputmode="numeric" id="np-pin" placeholder="452198" maxlength="6" oninput="this.value=this.value.replace(/\D/g,'').slice(0,6)">
        <button onclick="genPin()" style="background:var(--surf3);border:1.5px solid var(--brd);border-radius:var(--rs);padding:0 14px;color:var(--tx2);font-size:12px;font-family:var(--font);cursor:pointer;white-space:nowrap;flex-shrink:0;">Aléatoire</button>
      </div>
      <div class="err-msg" id="np-err"></div>
      <div class="btn-row">
        <button class="btn-p" onclick="createPatient()">Créer le patient</button>
        <button class="btn-s" onclick="closeModal('ov-np')">Annuler</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ MODAL : CHOIX BILAN ══ -->
<div class="ov" id="ov-bilan" onclick="closeModal('ov-bilan')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="drag"></div>
    <div class="sh-title">Choisir un bilan</div>
    <div class="sh-body">
      <div id="bilans-choice-list"></div>
      <div style="height:8px;"></div>
    </div>
  </div>
</div>

<!-- ══ BOTTOM SHEET : REEVALUATION D'UN SCORE ══ -->
<div class="ov" id="ov-reeval" onclick="closeModal('ov-reeval')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="drag"></div>
    <div class="sh-title" id="rv-title">Réévaluation</div>
    <div class="sh-ref" id="rv-ref"></div>
    <div class="sh-body" id="rv-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";

   scores:[

/* ─ Score transversal GROC (tous bilans) ─ */
const SCORE_GROC={key:'GROC',label:'Impression globale',type:'groc',unit:'',color:(v)=>v>=1?'good':v<=-1?'bad':'warn'};

/* ─ STATE ─ */
const S={uid:null,allPatients:[],filtered:[],pat:null,docs:[],expandedBilan:null,rvCtx:null};

/* ─ UTILS ─ */
const hideLoad=()=>{document.getElementById('loading').style.display='none';};
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
function ss(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));}
function avatarColor(nom){const c=['#177A5A','#1A6FA8','#C4621D','#8B4A6B','#8B2635','#5C7A9E','#8B5E3C','#6B3FA0'];let h=0;for(const x of(nom||'?'))h=(h*31+x.charCodeAt(0))%c.length;return c[h];}
function initials(p,n){return((p||'?')[0]+(n||'?')[0]).toUpperCase();}
function calcAge(ddn){if(!ddn)return null;const d=new Date(ddn),now=new Date();let a=now.getFullYear()-d.getFullYear();if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate()))a--;return a;}
function fmtDate(ts){if(!ts)return '';const d=ts&&ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});}
function uid6(){return String(Math.floor(100000+Math.random()*900000));}
function scoreClass(def,val){if(typeof def.color==='function')return def.color(parseFloat(val));return '';}

/* ─ MODALS ─ */
window.openModal=id=>{document.getElementById(id).classList.add('open');};
window.closeModal=id=>{document.getElementById(id).classList.remove('open');};

/* ══════════════════════════════════
   LISTE & RECHERCHE
══════════════════════════════════ */
window.onSearch=q=>{
  document.getElementById('search-clear').classList.toggle('show',q.length>0);
  const t=q.toLowerCase().trim();
  S.filtered=t?S.allPatients.filter(p=>{
    const full=(p.prenom+' '+p.nom).toLowerCase();
    return full.includes(t)||(p.nom+' '+p.prenom).toLowerCase().includes(t)||(p.pin||'').includes(t);
  }):[...S.allPatients];
  renderList();
};
window.clearSearch=()=>{
  document.getElementById('search-input').value='';
  document.getElementById('search-clear').classList.remove('show');
  S.filtered=[...S.allPatients];renderList();
};

function renderList(){
  const el=document.getElementById('patients-list');
  const n=S.filtered.length;
  document.getElementById('list-count').textContent=n===0?'Aucun patient':`${n} patient${n>1?'s':''}`;
  if(n===0){
    const q=document.getElementById('search-input').value.trim();
    el.innerHTML=`<div class="empty-state"><div class="empty-icon">${q?'🔍':'👥'}</div><div class="empty-title">${q?'Aucun résultat':'Aucun patient'}</div><div class="empty-sub">${q?'Aucun patient ne correspond à "'+q+'"':'Ajoutez votre premier patient.'}</div></div>`;
    return;
  }
  el.innerHTML='';
  S.filtered.forEach(p=>{
    const age=calcAge(p.ddn);const color=avatarColor(p.nom);
    const d=document.createElement('div');d.className='pat-card';
    d.innerHTML=`<div class="pat-avatar" style="background:${color}22;color:${color};">${initials(p.prenom,p.nom)}</div>
    <div class="pat-info">
      <div class="pat-name">${p.prenom} ${p.nom}</div>
      <div class="pat-meta">${age!==null?age+' ans · ':''}PIN ${p.pin||'—'}${p.motif?' · '+p.motif:''}</div>
      ${p._lastBilanDate?`<div style="font-size:11px;color:var(--tx3);margin-top:3px;">Dernier bilan : ${fmtDate(p._lastBilanDate)}</div>`:''}
    </div>
    <div class="pat-chip ${p._lastBilanDate?'green':''}">${p._lastBilanDate?'Suivi':'Nouveau'}</div>`;
    d.onclick=()=>openProfil(p.id);
    el.appendChild(d);
  });
}

/* ══════════════════════════════════
   CREATION PATIENT
══════════════════════════════════ */
window.genPin=()=>{document.getElementById('np-pin').value=uid6();};
window.createPatient=async()=>{
  const prenom=document.getElementById('np-prenom').value.trim();
  const nom=document.getElementById('np-nom').value.trim();
  const ddn=document.getElementById('np-ddn').value;
  const pin=document.getElementById('np-pin').value;
  const motif=document.getElementById('np-motif').value.trim();
  const err=document.getElementById('np-err');
  err.classList.remove('show');
  if(!prenom||!nom){err.textContent='Prénom et nom obligatoires.';err.classList.add('show');return;}
  if(!ddn){err.textContent='Date de naissance obligatoire.';err.classList.add('show');return;}
  if(pin.length!==6){err.textContent='Code patient = 6 chiffres exactement.';err.classList.add('show');return;}
  if(S.allPatients.some(p=>p.pin===pin)){err.textContent='Ce code est déjà utilisé.';err.classList.add('show');return;}
  try{
    const id='p_'+Date.now();
    const data={prenom,nom,ddn,pin,motif,createdAt:serverTimestamp()};
    await setDoc(pDoc(id),data);
    await setDoc(doc(db,'patients_index',pin),{uid_kine:S.uid,patient_id:id,ddn});
    S.allPatients.unshift({id,...data});S.filtered=[...S.allPatients];
    ['np-prenom','np-nom','np-ddn','np-motif','np-pin'].forEach(i=>{document.getElementById(i).value='';});
    closeModal('ov-np');renderList();toast('Patient créé ✓');
    openProfil(id);
  }catch(e){err.textContent='Erreur : '+e.message;err.classList.add('show');}
};

/* ══════════════════════════════════
   PROFIL PATIENT
══════════════════════════════════ */
async function openProfil(patId){
  const p=S.allPatients.find(x=>x.id===patId);if(!p)return;
  S.pat=p;S.docs=[];S.expandedBilan=null;
  const color=avatarColor(p.nom);
  const av=document.getElementById('profil-avatar');
  av.style.background=color+'22';av.style.color=color;av.textContent=initials(p.prenom,p.nom);
  document.getElementById('profil-nom').textContent=p.prenom+' '+p.nom;
  const age=calcAge(p.ddn);
  document.getElementById('profil-meta').textContent=(age!==null?age+' ans':'')+(p.ddn?' · Né(e) le '+new Date(p.ddn).toLocaleDateString('fr-FR'):'')+( p.motif?' · '+p.motif:'');
  document.getElementById('profil-pin-val').textContent='Code '+p.pin;
  ss('sc-profil');
  await loadDocs(patId);
}

async function loadDocs(patId){
  document.getElementById('timeline-wrap').innerHTML='<div style="color:var(--tx3);font-size:13px;padding:8px 0;">Chargement...</div>';
  try{
    const snap=await getDocs(query(dCol(patId),orderBy('timestamp','desc')));
    S.docs=[];snap.forEach(d=>S.docs.push({docId:d.id,...d.data()}));
    renderTimeline();
  }catch(e){document.getElementById('timeline-wrap').innerHTML='<div class="tl-empty">Erreur de chargement.</div>';}
}

/* ══════════════════════════════════
   TIMELINE — rendu principal
══════════════════════════════════ */
function renderTimeline(){
  const wrap=document.getElementById('timeline-wrap');
  /* On groupe : bilans complets d'un côté, scores isolés de l'autre */
  const bilans=S.docs.filter(d=>d.type==='bilan_complet');
  const reevals=S.docs.filter(d=>d.type==='score_isole');

  if(bilans.length===0){
    wrap.innerHTML='<div class="tl-empty">Aucun bilan pour ce patient.<br>Commencez par créer un nouveau bilan.</div>';
    return;
  }

  wrap.innerHTML='';

  bilans.forEach(b=>{
    const bi=BILANS.find(x=>x.id===b.bilanType)||{icon:'📋',color:'#8FA3B4',bg:'rgba(143,163,180,.1)',name:b.bilanType||'Bilan',scores:[]};
    /* Réévaluations liées à CE bilan */
    const linked=reevals.filter(r=>r.parentBilanId===b.docId).sort((a,z)=>{ const ta=a.timestamp?.seconds||0,tz=z.timestamp?.seconds||0;return ta-tz;});

    const isExpanded=S.expandedBilan===b.docId;

    /* ── Chips de résumé (valeurs initiales) ── */
    let summaryChips='';
    if(b.scores){Object.entries(b.scores).forEach(([k,v])=>{
      const def=(bi.scores||[]).find(s=>s.key===k)||{color:()=>''};
      summaryChips+=`<span class="score-chip ${scoreClass(def,v)}">${k} ${v}${def.unit||''}</span>`;
    });}

    /* ── Lignes de scores réévaluables ── */
    let scoreRows='';
    const allScoreDefs=[...(bi.scores||[]),SCORE_GROC];
    allScoreDefs.forEach(def=>{
      const initVal=b.scores?.[def.key];
      /* Historique des réévals pour ce score */
      const history=linked.filter(r=>r.scoreKey===def.key).map(r=>({val:r.value,date:fmtDate(r.timestamp)}));
      /* Fil d'évolution visuel */
      let evoHtml=`<span class="score-val-init" style="color:${initVal!==undefined?getValColor(def,initVal):'var(--tx3)'}">${initVal!==undefined?initVal+(def.unit||''):'—'}</span>`;
      history.forEach(h=>{
        const col=getValColor(def,h.val);
        evoHtml+=`<span class="score-arrow">→</span><span class="score-val-reeval" style="color:${col};">${h.val}${def.unit||''}</span>`;
      });
      scoreRows+=`<div class="score-row">
        <div class="score-row-left">
          <div class="score-row-name">${def.label}</div>
          <div class="score-evolution">${evoHtml}</div>
        </div>
        <button class="btn-reeval" onclick="openReeval('${b.docId}','${bi.id}','${def.key}')">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M4 4v5h5M20 20v-5h-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M20 12A8 8 0 0 0 6.3 6.3M4 12a8 8 0 0 0 13.7 5.7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          Rééval.
        </button>
      </div>`;
    });

    /* ── Tags des réévals récentes (arbre sous le bilan) ── */
    let reevalTags='';
    if(linked.length>0){
      reevalTags='<div class="tl-reevals">';
      linked.slice().reverse().forEach(r=>{
        reevalTags+=`<div class="tl-reeval-tag"><span>${r.scoreKey}</span> ${r.value}${r.scoreUnit||''} · <span style="color:var(--tx3)">${fmtDate(r.timestamp)}</span></div>`;
      });
      reevalTags+='</div>';
    }

    const item=document.createElement('div');
    item.className='tl-bilan';
    item.style.position='relative';
    item.innerHTML=`
      <div class="tl-bilan-card${isExpanded?' expanded':''}" id="card-${b.docId}" onclick="toggleBilan('${b.docId}')">
        <div class="tl-bilan-hdr">
          <div class="tl-dot" style="background:${bi.bg}">${bi.icon}</div>
          <div class="tl-bilan-info">
            <div class="tl-bilan-name">${bi.name}${b.cote?' <span style="color:var(--tx3);font-weight:400;font-size:12px;">('+b.cote+')</span>':''}</div>
            <div class="tl-bilan-date">${fmtDate(b.timestamp)}${linked.length>0?' · <span style="color:var(--acc)">'+linked.length+' rééval.</span>':''}</div>
          </div>
          <span class="tl-chevron">›</span>
        </div>
        ${summaryChips?`<div class="tl-bilan-scores">${summaryChips}</div>`:''}
      </div>
      ${reevalTags}
      <div class="tl-detail${isExpanded?' open':''}" id="detail-${b.docId}">
        <div class="tl-detail-inner">
          <div class="tl-scores-title">Scores réévaluables</div>
          ${scoreRows}
        </div>
      </div>
    `;
    wrap.appendChild(item);
  });
}

function getValColor(def,val){
  const cls=typeof def.color==='function'?def.color(parseFloat(val)):'';
  if(cls==='good')return'var(--green)';
  if(cls==='bad')return'var(--red)';
  if(cls==='warn')return'var(--acc3)';
  return'var(--tx)';
}

window.toggleBilan=id=>{
  S.expandedBilan=S.expandedBilan===id?null:id;
  renderTimeline();
};

/* ══════════════════════════════════
   NOUVEAU BILAN (depuis profil)
══════════════════════════════════ */
window.openNewBilan=()=>{
  if(!S.pat)return;
  const list=document.getElementById('bilans-choice-list');list.innerHTML='';
  BILANS.forEach(b=>{
    const btn=document.createElement('button');btn.className='bilan-opt';
    btn.innerHTML=`<span class="bilan-dot-sm" style="background:${b.bg}">${b.icon}</span><div><div class="bilan-opt-name">${b.name}</div><div class="bilan-opt-sub">${b.sub}</div></div>`;
    btn.onclick=()=>launchBilan(b);
    list.appendChild(btn);
  });
  openModal('ov-bilan');
};

function launchBilan(b){
  closeModal('ov-bilan');
  sessionStorage.setItem('ks-bilan-ctx',JSON.stringify({patientId:S.pat.id,uid:S.uid,prenom:S.pat.prenom,nom:S.pat.nom,ddn:S.pat.ddn}));
  window.location.href=b.url+'?patientId='+S.pat.id+'&uid='+S.uid;
}

/* ══════════════════════════════════
   BOTTOM SHEET REEVALUATION
   Ouverture depuis le bouton "Rééval." sur un score
══════════════════════════════════ */
window.openReeval=(bilanDocId,bilanTypeId,scoreKey)=>{
  const bi=BILANS.find(x=>x.id===bilanTypeId)||{scores:[],name:bilanTypeId};
  const def=[...(bi.scores||[]),SCORE_GROC].find(s=>s.key===scoreKey);
  if(!def)return;

  /* Dernière valeur connue (bilan initial ou dernière rééval) */
  const bilan=S.docs.find(d=>d.docId===bilanDocId);
  const lastReeval=S.docs.filter(d=>d.type==='score_isole'&&d.parentBilanId===bilanDocId&&d.scoreKey===scoreKey).sort((a,b)=>(b.timestamp?.seconds||0)-(a.timestamp?.seconds||0))[0];
  const lastVal=lastReeval!==undefined?lastReeval.value:(bilan?.scores?.[scoreKey]??null);

  S.rvCtx={bilanDocId,bilanTypeId,scoreKey,def,lastVal};

  document.getElementById('rv-title').textContent='Réévaluer — '+def.label;
  document.getElementById('rv-ref').textContent=lastVal!==null?'Dernière valeur : '+lastVal+(def.unit||''):'Première saisie';
  document.getElementById('rv-body').innerHTML=buildReevalBody(def,lastVal);
  openModal('ov-reeval');
};

function buildReevalBody(def,lastVal){
  if(def.type==='slider'){
    const start=lastVal??Math.round((def.min+def.max)/2);
    return `<div class="eva-big" id="rv-num">${start}</div>
    <div class="eva-range-wrap">
      <input type="range" id="rv-range" min="${def.min}" max="${def.max}" step="${def.step}" value="${start}"
        oninput="document.getElementById('rv-num').textContent=parseFloat(this.value).toFixed(${def.step<1?1:0}).replace(/\\.0$/,'')">
    </div>
    <div class="range-labels"><span>${def.min}</span><span>${def.max} ${def.unit}</span></div>
    <div class="btn-row"><button class="btn-p" onclick="saveReeval()">Enregistrer</button><button class="btn-s" onclick="closeModal('ov-reeval')">Annuler</button></div>`;
  }
  if(def.type==='chips'){
    const sel=lastVal??0;
    return `<div class="chips-grid" id="rv-chips">
      ${def.options.map(o=>`<button class="chip${o===sel?' sel':''}" onclick="selChip(${o})" data-v="${o}">${o}</button>`).join('')}
    </div>
    <div class="btn-row" style="margin-top:18px;"><button class="btn-p" onclick="saveReeval()">Enregistrer</button><button class="btn-s" onclick="closeModal('ov-reeval')">Annuler</button></div>`;
  }
  if(def.type==='groc'){
    const opts=[{v:3,icon:'🌟',lbl:'Très grande amélioration',sub:'+3'},{v:2,icon:'😊',lbl:'Grande amélioration',sub:'+2'},{v:1,icon:'🙂',lbl:'Légère amélioration',sub:'+1'},{v:0,icon:'😐',lbl:'Pas de changement',sub:'0'},{v:-1,icon:'😕',lbl:'Légère détérioration',sub:'-1'},{v:-2,icon:'😟',lbl:'Grande détérioration',sub:'-2'},{v:-3,icon:'🚨',lbl:'Très grande détérioration',sub:'-3'}];
    return opts.map(o=>`<div class="groc-opt${o.v===lastVal?' sel':''}" onclick="saveGROC(${o.v})" data-v="${o.v}"><span style="font-size:20px;">${o.icon}</span><div><div class="groc-opt-lbl">${o.lbl}</div><div class="groc-opt-sub">${o.sub}</div></div></div>`).join('');
  }
  return '';
}

window.selChip=v=>{document.querySelectorAll('#rv-chips .chip').forEach(c=>c.classList.toggle('sel',parseInt(c.dataset.v)===v));};

window.saveReeval=async()=>{
  const ctx=S.rvCtx;if(!ctx||!S.pat)return;
  let value;
  if(ctx.def.type==='slider'){
    value=parseFloat(document.getElementById('rv-range').value);
  }else if(ctx.def.type==='chips'){
    const sel=document.querySelector('#rv-chips .chip.sel');
    if(!sel){toast('Sélectionnez une valeur');return;}
    value=parseInt(sel.dataset.v);
  }
  await persistReeval(ctx,value);
};

window.saveGROC=async v=>{
  const ctx=S.rvCtx;if(!ctx||!S.pat)return;
  await persistReeval(ctx,v);
};

async function persistReeval(ctx,value){
  try{
    const docId='rv_'+Date.now();
    await setDoc(dDoc(S.pat.id,docId),{
      type:'score_isole',
      parentBilanId:ctx.bilanDocId,
      bilanType:ctx.bilanTypeId,
      scoreKey:ctx.scoreKey,
      scoreLabel:ctx.def.label,
      scoreUnit:ctx.def.unit||'',
      value,
      timestamp:serverTimestamp(),
      patientId:S.pat.id,
      therapistUid:S.uid,
    });
    closeModal('ov-reeval');
    toast('Réévaluation enregistrée ✓');
    await loadDocs(S.pat.id);
  }catch(e){toast('Erreur : '+e.message);}
}

/* ══════════════════════════════════
   KS.saveBilan — API publique
   Appelée depuis les fichiers bilan
══════════════════════════════════ */
window.KS={};
window.KS.saveBilan=async function(data){
  const p=new URLSearchParams(window.location.search);
  const patientId=p.get('patientId'),uid=p.get('uid');
  if(!patientId||!uid)return{ok:false,error:'context_missing'};
  try{
    const docId='bilan_'+Date.now();
    await setDoc(doc(db,'therapists',uid,'patients',patientId,'data',docId),{
      type:'bilan_complet',
      bilanType:data.bilanType||'inconnu',
      cote:data.cote||null,
      scores:data.scores||{},
      formData:data.formData||{},
      timestamp:serverTimestamp(),
      patientId,therapistUid:uid,
    });
    await updateDoc(doc(db,'therapists',uid,'patients',patientId),{_lastBilanDate:serverTimestamp()});
    return{ok:true,docId};
  }catch(e){return{ok:false,error:e.message};}
};

/* ─ Navigation ─ */
window.goBack=()=>{S.pat=null;ss('sc-list');};

/* ══════════════════════════════════
   CHARGEMENT INITIAL
══════════════════════════════════ */
async function loadPatients(){
  try{
    const snap=await getDocs(pCol());
    S.allPatients=[];snap.forEach(d=>S.allPatients.push({id:d.id,...d.data()}));
    S.allPatients.sort((a,b)=>(a.nom||'').localeCompare(b.nom||'','fr'));
    S.filtered=[...S.allPatients];
    renderList();
  }catch(e){toast('Erreur de chargement');}
}

onAuthStateChanged(auth,async user=>{
  hideLoad();
  if(user&&!user.isAnonymous){
    S.uid=user.uid;
    await loadPatients();
    const ret=new URLSearchParams(window.location.search).get('patientId');
    ss('sc-list');
    if(ret){const p=S.allPatients.find(x=>x.id===ret);if(p)openProfil(ret);}
  }else{
    try{await signInAnonymously(auth);}catch(e){}
    window.location.href='index.html';
  }
});

/* ─ Tap feedback iOS ─ */
(()=>{const sel=['.pat-card','.btn-add','.btn-action','.bilan-opt','.btn-reeval','.tl-bilan-card','.chip','.groc-opt','.btn-p','.btn-s'];function add(el){if(el._t)return;el._t=1;el.addEventListener('touchstart',()=>{el.style.opacity='.7';if(navigator.vibrate)navigator.vibrate(6);},{passive:true});el.addEventListener('touchend',()=>{setTimeout(()=>el.style.opacity='',150);},{passive:true});}const obs=new MutationObserver(()=>sel.forEach(s=>document.querySelectorAll(s).forEach(add)));obs.observe(document.body,{childList:true,subtree:true});sel.forEach(s=>document.querySelectorAll(s).forEach(add));})();
</script>
