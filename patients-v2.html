<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1923">
<title>Patients · KinéScope</title>
<style>
/* ── TOKENS (miroir index.html) ── */
:root{
  --bg:#0F1923;--surf:#16222E;--surf2:#1E2F40;--surf3:#243647;
  --tx:#E8EDF2;--tx2:#8FA3B4;--tx3:#5A7080;
  --acc:#2DD4BF;--acc2:#0EA5E9;--acc3:#F59E0B;
  --red:#F87171;--green:#34D399;
  --brd:#243647;--r:14px;--rs:10px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);overflow:hidden;}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .22s;}
.screen.active{opacity:1;pointer-events:all;}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px;}
.spin{width:36px;height:36px;border:3px solid var(--surf3);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

/* ── HEADER FIXE ── */
.hdr{
  flex-shrink:0;
  padding:calc(var(--safe-t)+14px) 16px 14px;
  background:var(--bg);
  border-bottom:1px solid var(--brd);
  display:flex;flex-direction:column;gap:12px;
}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hdr-back{background:none;border:none;color:var(--tx2);font-size:14px;font-family:var(--font);cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 0;}
.hdr-back:active{color:var(--acc);}
.hdr-title{font-size:18px;font-weight:800;letter-spacing:-.3px;}
.hdr-title em{font-style:normal;color:var(--acc);}
.btn-add{
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  border:none;border-radius:var(--rs);
  padding:10px 16px;
  font-size:13px;font-weight:700;color:#fff;font-family:var(--font);
  cursor:pointer;display:flex;align-items:center;gap:7px;
  box-shadow:0 4px 18px rgba(45,212,191,.3);
  transition:transform .1s;flex-shrink:0;
}
.btn-add:active{transform:scale(.95);}

/* ── BARRE RECHERCHE ── */
.search-wrap{position:relative;}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none;}
#search-input{
  width:100%;
  background:var(--surf2);
  border:1.5px solid var(--brd);
  border-radius:var(--rs);
  padding:12px 40px 12px 42px;
  font-size:15px;color:var(--tx);font-family:var(--font);
  outline:none;-webkit-appearance:none;
  transition:border-color .15s;
}
#search-input:focus{border-color:var(--acc);}
#search-input::placeholder{color:var(--tx3);}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--surf3);border:none;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx2);font-size:13px;opacity:0;transition:opacity .15s;}
.search-clear.show{opacity:1;}

/* ── LISTE PATIENTS ── */
#sc-list{background:var(--bg);}
.list-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--safe-b)+80px);}
.list-count{font-size:11px;color:var(--tx3);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;}
.pat-card{
  background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r);
  padding:16px;margin-bottom:10px;cursor:pointer;
  display:flex;align-items:center;gap:14px;
  transition:border-color .15s,transform .1s;
}
.pat-card:active{transform:scale(.98);border-color:var(--acc);}
.pat-avatar{
  width:46px;height:46px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;flex-shrink:0;
}
.pat-info{flex:1;min-width:0;}
.pat-name{font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pat-meta{font-size:12px;color:var(--tx2);margin-top:3px;}
.pat-chip{
  background:var(--surf3);border-radius:20px;
  padding:4px 10px;font-size:11px;font-weight:600;color:var(--tx2);
  flex-shrink:0;
}
.pat-chip.green{background:rgba(52,211,153,.15);color:var(--green);}
.empty-state{text-align:center;padding:60px 24px;}
.empty-icon{font-size:48px;margin-bottom:16px;}
.empty-title{font-size:17px;font-weight:700;margin-bottom:8px;}
.empty-sub{font-size:13px;color:var(--tx2);line-height:1.5;}

/* ── PROFIL PATIENT ── */
#sc-profil{background:var(--bg);}
.profil-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--safe-b)+24px);}
.profil-hero{
  background:linear-gradient(135deg,var(--surf2),var(--surf));
  border:1.5px solid var(--brd);border-radius:var(--r);
  padding:20px;margin-bottom:20px;
  display:flex;align-items:center;gap:16px;
}
.profil-avatar{
  width:60px;height:60px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;flex-shrink:0;
}
.profil-nom{font-size:20px;font-weight:800;line-height:1.2;}
.profil-meta{font-size:13px;color:var(--tx2);margin-top:4px;}
.profil-pin{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surf3);border-radius:20px;
  padding:5px 12px;font-size:12px;font-weight:700;
  color:var(--acc);margin-top:8px;
}
.actions-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
.btn-action{
  background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r);
  padding:16px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  font-family:var(--font);transition:border-color .15s,transform .1s;
}
.btn-action:active{transform:scale(.97);}
.btn-action.primary{background:linear-gradient(135deg,rgba(45,212,191,.12),rgba(14,165,233,.08));border-color:rgba(45,212,191,.3);}
.btn-action-icon{font-size:24px;}
.btn-action-lbl{font-size:13px;font-weight:700;color:var(--tx);}
.btn-action-sub{font-size:11px;color:var(--tx2);}
.sec-label{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.timeline-empty{background:var(--surf);border:1.5px dashed var(--brd);border-radius:var(--r);padding:24px;text-align:center;color:var(--tx3);font-size:13px;}

/* ── TIMELINE BILANS ── */
.timeline{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
.tl-item{
  background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--r);
  padding:16px;cursor:pointer;
  transition:border-color .15s,transform .1s;
  display:flex;align-items:flex-start;gap:14px;
}
.tl-item:active{transform:scale(.98);}
.tl-dot{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;margin-top:1px;
}
.tl-body{flex:1;min-width:0;}
.tl-type{font-size:12px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.tl-name{font-size:14px;font-weight:700;line-height:1.3;}
.tl-date{font-size:12px;color:var(--tx2);margin-top:4px;}
.tl-scores{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.score-pill{background:var(--surf3);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--tx2);}
.score-pill.good{background:rgba(52,211,153,.15);color:var(--green);}
.score-pill.warn{background:rgba(245,158,11,.15);color:var(--acc3);}
.score-pill.bad{background:rgba(248,113,113,.15);color:var(--red);}
.tl-arr{color:var(--tx3);font-size:18px;align-self:center;flex-shrink:0;}

/* ── SECTION RÉÉVALUATIONS RAPIDES ── */
.reeval-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:28px;}
.reeval-btn{
  background:var(--surf);border:1.5px solid var(--brd);border-radius:var(--rs);
  padding:14px 8px;cursor:pointer;text-align:center;
  font-family:var(--font);transition:border-color .15s,transform .1s;
}
.reeval-btn:active{transform:scale(.95);}
.reeval-icon{font-size:20px;margin-bottom:6px;}
.reeval-lbl{font-size:11px;font-weight:700;color:var(--tx);}
.reeval-last{font-size:10px;color:var(--tx3);margin-top:3px;}

/* ── MODAL (OVERLAY) ── */
.ov{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:200;opacity:0;pointer-events:none;
  transition:opacity .22s;
}
.ov.open{opacity:1;pointer-events:all;}
.sheet{
  background:var(--surf);border-radius:22px 22px 0 0;
  width:100%;max-width:520px;
  padding:0 0 calc(var(--safe-b)+16px);
  transform:translateY(20px);transition:transform .25s cubic-bezier(.4,0,.2,1);
  max-height:90vh;overflow-y:auto;
}
.ov.open .sheet{transform:translateY(0);}
.drag{width:36px;height:4px;background:var(--brd);border-radius:2px;margin:12px auto 18px;}
.sh-title{font-size:18px;font-weight:800;padding:0 20px;margin-bottom:20px;}
.sh-body{padding:0 20px;}
.fl{font-size:12px;font-weight:700;color:var(--tx2);display:block;margin-bottom:6px;margin-top:14px;}
.fl:first-child{margin-top:0;}
.fi{
  width:100%;background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--rs);
  padding:14px;font-size:15px;color:var(--tx);font-family:var(--font);
  outline:none;-webkit-appearance:none;transition:border-color .15s;color-scheme:dark;
}
.fi:focus{border-color:var(--acc);}
.fi-row{display:flex;gap:10px;}
.fi-row .fi{flex:1;}
.btn-row{display:flex;gap:10px;margin-top:20px;margin-bottom:6px;}
.btn-p{flex:1;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;border-radius:var(--r);padding:16px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;transition:transform .1s;box-shadow:0 4px 18px rgba(45,212,191,.25);}
.btn-p:active{transform:scale(.97);}
.btn-s{flex:1;background:var(--surf3);color:var(--tx2);border:1.5px solid var(--brd);border-radius:var(--r);padding:16px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;transition:transform .1s;}
.btn-s:active{transform:scale(.97);}
.err-msg{color:var(--red);font-size:12px;font-weight:600;margin-top:8px;display:none;}
.err-msg.show{display:block;}

/* ── MODAL BILAN ── */
.bilans-list{display:flex;flex-direction:column;gap:8px;}
.bilan-opt{
  background:var(--surf2);border:1.5px solid var(--brd);border-radius:var(--rs);
  padding:14px 16px;cursor:pointer;
  display:flex;align-items:center;gap:12px;
  font-family:var(--font);transition:border-color .15s,transform .1s;
}
.bilan-opt:active{transform:scale(.98);}
.bilan-dot-sm{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.bilan-opt-name{font-size:14px;font-weight:700;color:var(--tx);}
.bilan-opt-sub{font-size:11px;color:var(--tx2);}

/* ── MODAL RÉÉVAL RAPIDE ── */
.eva-slider-wrap{padding:8px 0;}
.eva-label{font-size:13px;color:var(--tx2);margin-bottom:10px;}
.eva-val{font-size:36px;font-weight:800;text-align:center;margin-bottom:8px;color:var(--acc);}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:var(--surf3);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--acc);cursor:pointer;box-shadow:0 2px 8px rgba(45,212,191,.4);}
.psfs-item{background:var(--surf2);border-radius:var(--rs);padding:12px;margin-bottom:8px;}
.psfs-item-lbl{font-size:13px;font-weight:600;margin-bottom:8px;}
.psfs-chips{display:flex;gap:6px;flex-wrap:wrap;}
.psfs-chip{background:var(--surf3);border:1.5px solid var(--brd);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);color:var(--tx2);transition:all .1s;}
.psfs-chip.sel{background:var(--acc);color:#0F1923;border-color:var(--acc);}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--safe-b)+24px);left:50%;transform:translateX(-50%) translateY(10px);background:var(--surf3);color:var(--tx);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:999;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><p style="color:var(--tx2);font-size:14px">Chargement…</p></div>

<!-- ══════════════════════════════════════
     ÉCRAN 1 : LISTE PATIENTS + RECHERCHE
══════════════════════════════════════ -->
<div class="screen" id="sc-list">
  <!-- Header fixe avec recherche -->
  <div class="hdr">
    <div class="hdr-row">
      <div>
        <button class="hdr-back" onclick="window.location.href='index.html'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          Dashboard
        </button>
      </div>
      <!-- BOUTON AJOUTER PATIENT — très visible, CTA principal -->
      <button class="btn-add" onclick="openModal('ov-np')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        Ajouter un patient
      </button>
    </div>
    <!-- Barre de recherche temps réel -->
    <div class="search-wrap">
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <input type="search" id="search-input" placeholder="Rechercher un patient…" oninput="onSearch(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <!-- Corps scrollable -->
  <div class="list-scroll">
    <div class="list-count" id="list-count"></div>
    <div id="patients-list"></div>
  </div>
</div>

<!-- ══════════════════════════════════════
     ÉCRAN 2 : PROFIL PATIENT
══════════════════════════════════════ -->
<div class="screen" id="sc-profil">
  <!-- Header profil -->
  <div class="hdr" style="gap:0;">
    <div class="hdr-row">
      <button class="hdr-back" onclick="goBack()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        Patients
      </button>
      <button onclick="openNewBilan()" style="background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:var(--rs);padding:9px 14px;font-size:12px;font-weight:700;color:#fff;font-family:var(--font);cursor:pointer;display:flex;align-items:center;gap:6px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        Nouveau bilan
      </button>
    </div>
  </div>

  <div class="profil-scroll">
    <!-- Hero card patient -->
    <div class="profil-hero" id="profil-hero">
      <div class="profil-avatar" id="profil-avatar"></div>
      <div style="flex:1;min-width:0;">
        <div class="profil-nom" id="profil-nom">—</div>
        <div class="profil-meta" id="profil-meta"></div>
        <div class="profil-pin" id="profil-pin">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 11V7a4 4 0 018 0v4" stroke="currentColor" stroke-width="2"/></svg>
          <span id="profil-pin-val">—</span>
        </div>
      </div>
    </div>

    <!-- Actions rapides -->
    <div class="actions-row">
      <button class="btn-action primary" onclick="openNewBilan()">
        <span class="btn-action-icon">📋</span>
        <span class="btn-action-lbl">Nouveau bilan</span>
        <span class="btn-action-sub">Bilan complet EBP</span>
      </button>
      <button class="btn-action" onclick="openReeval()">
        <span class="btn-action-icon">📈</span>
        <span class="btn-action-lbl">Réévaluation</span>
        <span class="btn-action-sub">Score isolé rapide</span>
      </button>
    </div>

    <!-- Section Évolution (scores rapides) -->
    <div class="sec-label">
      Évolution des scores
      <span id="reeval-count" style="font-size:11px;color:var(--tx3);font-weight:400;text-transform:none;letter-spacing:0;"></span>
    </div>
    <div class="reeval-grid" id="reeval-grid">
      <!-- rempli dynamiquement -->
    </div>

    <!-- Timeline bilans -->
    <div class="sec-label">
      Bilans & Réévaluations
      <span id="bilans-count" style="font-size:11px;color:var(--tx3);font-weight:400;text-transform:none;letter-spacing:0;"></span>
    </div>
    <div class="timeline" id="timeline">
      <div class="timeline-empty">Aucun bilan enregistré pour ce patient.</div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MODAL : NOUVEAU PATIENT
══════════════════════════════════════ -->
<div class="ov" id="ov-np" onclick="closeModal('ov-np')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="drag"></div>
    <div class="sh-title">Nouveau patient</div>
    <div class="sh-body">
      <div class="fi-row" style="margin-top:0;">
        <div style="flex:1;">
          <label class="fl" style="margin-top:0;">Prénom</label>
          <input class="fi" type="text" id="np-prenom" placeholder="Marie" autocomplete="off">
        </div>
        <div style="flex:1;">
          <label class="fl" style="margin-top:0;">Nom</label>
          <input class="fi" type="text" id="np-nom" placeholder="Dupont" autocomplete="off">
        </div>
      </div>
      <label class="fl">Date de naissance <span style="color:var(--red)">*</span></label>
      <input class="fi" type="date" id="np-ddn">
      <label class="fl">Motif de consultation</label>
      <input class="fi" type="text" id="np-motif" placeholder="ex: Lombalgie post-chirurgicale" autocomplete="off">
      <label class="fl">Code patient (6 chiffres)</label>
      <div class="fi-row">
        <input class="fi" type="text" inputmode="numeric" id="np-pin"
          placeholder="452198" maxlength="6"
          oninput="this.value=this.value.replace(/\D/g,'').slice(0,6)">
        <button onclick="genPin()" style="background:var(--surf3);border:1.5px solid var(--brd);border-radius:var(--rs);padding:0 14px;color:var(--tx2);font-size:12px;font-family:var(--font);cursor:pointer;white-space:nowrap;flex-shrink:0;">Aléatoire</button>
      </div>
      <div class="err-msg" id="np-err"></div>
      <div class="btn-row">
        <button class="btn-p" onclick="createPatient()">Créer le patient</button>
        <button class="btn-s" onclick="closeModal('ov-np')">Annuler</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MODAL : CHOIX DU BILAN
══════════════════════════════════════ -->
<div class="ov" id="ov-bilan" onclick="closeModal('ov-bilan')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="drag"></div>
    <div class="sh-title">Choisir un bilan</div>
    <div class="sh-body">
      <div class="bilans-list" id="bilans-choice-list">
        <!-- rempli dynamiquement -->
      </div>
      <div style="height:12px;"></div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MODAL : RÉÉVALUATION RAPIDE
══════════════════════════════════════ -->
<div class="ov" id="ov-reeval" onclick="closeModal('ov-reeval')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="drag"></div>
    <div class="sh-title">Réévaluation rapide</div>
    <div class="sh-body">
      <!-- Choix du score -->
      <div id="reeval-choice">

const hideLoad=()=>{document.getElementById('loading').style.display='none';};
function showToast(msg,dur=2400){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),dur);
}
function ss(id){
  document.querySelectorAll('.screen').forEach(s=>{
    if(s.id===id){s.classList.add('active');}
    else{s.classList.remove('active');}
  });
}
function avatarColor(nom){
  const colors=['#177A5A','#1A6FA8','#C4621D','#8B4A6B','#8B2635','#5C7A9E','#8B5E3C','#6B3FA0'];
  let h=0;for(const c of(nom||'?'))h=(h*31+c.charCodeAt(0))%colors.length;
  return colors[h];
}
function initials(p,n){return((p||'?')[0]+(n||'?')[0]).toUpperCase();}
function calcAge(ddn){
  if(!ddn)return null;
  const d=new Date(ddn),now=new Date();
  let a=now.getFullYear()-d.getFullYear();
  if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate()))a--;
  return a;
}
function fmtDate(ts){
  if(!ts)return '';
  const d=ts instanceof Timestamp?ts.toDate():new Date(ts);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
}
function uid6(){return String(Math.floor(100000+Math.random()*900000));}

// ── MODALS ──
window.openModal=id=>{document.getElementById(id).classList.add('open');};
window.closeModal=id=>{document.getElementById(id).classList.remove('open');};

// ══════════════════════════════════════
// RECHERCHE TEMPS RÉEL
// ══════════════════════════════════════
window.onSearch=q=>{
  const clear=document.getElementById('search-clear');
  clear.classList.toggle('show',q.length>0);
  const term=q.toLowerCase().trim();
  if(!term){S.filtered=[...S.allPatients];}
  else{
    S.filtered=S.allPatients.filter(p=>{
      const full=(p.prenom+' '+p.nom).toLowerCase();
      const rev=(p.nom+' '+p.prenom).toLowerCase();
      return full.includes(term)||rev.includes(term)||(p.pin||'').includes(term);
    });
  }
  renderList();
};
window.clearSearch=()=>{
  document.getElementById('search-input').value='';
  document.getElementById('search-clear').classList.remove('show');
  S.filtered=[...S.allPatients];
  renderList();
};

// ── RENDU LISTE ──
function renderList(){
  const el=document.getElementById('patients-list');
  const count=document.getElementById('list-count');
  const n=S.filtered.length;
  count.textContent=n===0?'Aucun patient':`${n} patient${n>1?'s':''}`;

  if(n===0){
    const q=document.getElementById('search-input').value.trim();
    el.innerHTML=`<div class="empty-state">
      <div class="empty-icon">${q?'🔍':'👥'}</div>
      <div class="empty-title">${q?'Aucun résultat':'Aucun patient'}</div>
      <div class="empty-sub">${q?`Aucun patient ne correspond à "${q}"`:'Ajoutez votre premier patient avec le bouton ci-dessus.'}</div>
    </div>`;
    return;
  }

  el.innerHTML='';
  S.filtered.forEach(p=>{
    const age=calcAge(p.ddn);
    const color=avatarColor(p.nom);
    const lastBilan=p._lastBilanDate?fmtDate(p._lastBilanDate):null;

    const card=document.createElement('div');
    card.className='pat-card';
    card.innerHTML=`
      <div class="pat-avatar" style="background:${color}22;color:${color};">${initials(p.prenom,p.nom)}</div>
      <div class="pat-info">
        <div class="pat-name">${p.prenom} ${p.nom}</div>
        <div class="pat-meta">${age!==null?age+' ans · ':''}<span style="color:var(--tx3);">PIN ${p.pin||'—'}</span>${p.motif?` · ${p.motif}`:''}</div>
        ${lastBilan?`<div style="font-size:11px;color:var(--tx3);margin-top:3px;">Dernier bilan : ${lastBilan}</div>`:''}
      </div>
      <div class="pat-chip ${lastBilan?'green':''}">${lastBilan?'Suivi':'Nouveau'}</div>
    `;
    card.onclick=()=>openProfil(p.id);
    el.appendChild(card);
  });
}

// ══════════════════════════════════════
// CRÉATION PATIENT
// ══════════════════════════════════════
window.genPin=()=>{document.getElementById('np-pin').value=uid6();};

window.createPatient=async()=>{
  const prenom=document.getElementById('np-prenom').value.trim();
  const nom=document.getElementById('np-nom').value.trim();
  const ddn=document.getElementById('np-ddn').value;
  const pin=document.getElementById('np-pin').value;
  const motif=document.getElementById('np-motif').value.trim();
  const err=document.getElementById('np-err');

  err.classList.remove('show');
  if(!prenom||!nom){err.textContent='Prénom et nom obligatoires.';err.classList.add('show');return;}
  if(!ddn){err.textContent='La date de naissance est obligatoire.';err.classList.add('show');return;}
  if(pin.length!==6){err.textContent='Le code patient doit faire exactement 6 chiffres.';err.classList.add('show');return;}
  // Vérif unicité du PIN
  if(S.allPatients.some(p=>p.pin===pin)){err.textContent='Ce code est déjà utilisé.';err.classList.add('show');return;}

  try{
    const id='p_'+Date.now();
    const data={prenom,nom,ddn,pin,motif,createdAt:serverTimestamp()};

    // 1. Écrire le patient sous /therapists/{uid}/patients/{id}
    await setDoc(patientDoc(id),data);

    // 2. Écrire dans l'index global pour le flux patient (patient-login.html)
    await setDoc(doc(db,'patients_index',pin),{uid_kine:S.uid,patient_id:id,ddn});

    // Mettre à jour l'état local
    S.allPatients.unshift({id,...data});
    S.filtered=[...S.allPatients];
    // Reset form
    ['np-prenom','np-nom','np-ddn','np-motif','np-pin'].forEach(i=>{document.getElementById(i).value='';});
    closeModal('ov-np');
    renderList();
    showToast('Patient créé ✓');
    // Ouvrir directement le profil
    openProfil(id);
  }catch(e){
    console.error('[createPatient]',e);
    err.textContent='Erreur : '+e.message;err.classList.add('show');
  }
};

// ══════════════════════════════════════
// PROFIL PATIENT
// ══════════════════════════════════════
async function openProfil(patId){
  const p=S.allPatients.find(x=>x.id===patId);
  if(!p)return;
  S.currentPatient=p;
  S.currentDocs=[];

  // Remplir le hero
  const color=avatarColor(p.nom);
  document.getElementById('profil-avatar').style.background=color+'22';
  document.getElementById('profil-avatar').style.color=color;
  document.getElementById('profil-avatar').textContent=initials(p.prenom,p.nom);
  document.getElementById('profil-nom').textContent=p.prenom+' '+p.nom;
  const age=calcAge(p.ddn);
  document.getElementById('profil-meta').textContent=(age!==null?age+' ans':'')+
    (p.ddn?' · Né(e) le '+new Date(p.ddn).toLocaleDateString('fr-FR'):'')+
    (p.motif?' · '+p.motif:'');
  document.getElementById('profil-pin-val').textContent='Code '+p.pin;

  ss('sc-profil');
  await loadPatientDocs(patId);
}

async function loadPatientDocs(patId){
  document.getElementById('timeline').innerHTML='<div style="color:var(--tx3);font-size:13px;padding:12px 0;">Chargement…</div>';
  try{
    // Charger tous les docs de /data triés par date décroissante
    const snap=await getDocs(query(dataCol(patId),orderBy('timestamp','desc')));
    S.currentDocs=[];
    snap.forEach(d=>S.currentDocs.push({docId:d.id,...d.data()}));
    renderTimeline();
    renderReevals();
  }catch(e){
    console.error('[loadPatientDocs]',e);
    document.getElementById('timeline').innerHTML='<div class="timeline-empty">Erreur de chargement.</div>';
  }
}

// ── RENDU TIMELINE ──
function renderTimeline(){
  const el=document.getElementById('timeline');
  const bilans=S.currentDocs.filter(d=>d.type==='bilan_complet');
  document.getElementById('bilans-count').textContent=bilans.length+' bilan'+(bilans.length>1?'s':'');

  if(bilans.length===0){
    el.innerHTML='<div class="timeline-empty">Aucun bilan enregistré pour ce patient.</div>';
    return;
  }
  el.innerHTML='';
  bilans.forEach(b=>{
    const bi=BILANS.find(x=>x.id===b.bilanType)||{icon:'📋',color:'#8FA3B4',bg:'rgba(143,163,180,.1)',name:b.bilanType||'Bilan'};
    const div=document.createElement('div');
    div.className='tl-item';
    // Construire les score pills
    let pills='';
    if(b.scores){
      Object.entries(b.scores).forEach(([k,v])=>{
        const cls=typeof v==='number'&&v<=3?'good':typeof v==='number'&&v>=7?'bad':'warn';
        pills+=`<span class="score-pill ${cls}">${k}: ${v}</span>`;
      });
    }
    div.innerHTML=`
      <div class="tl-dot" style="background:${bi.bg}">${bi.icon}</div>
      <div class="tl-body">
        <div class="tl-type">${b.type==='bilan_complet'?'Bilan complet':'Réévaluation'}</div>
        <div class="tl-name">${bi.name}${b.cote?' ('+b.cote+')':''}</div>
        <div class="tl-date">${fmtDate(b.timestamp)}</div>
        ${pills?`<div class="tl-scores">${pills}</div>`:''}
      </div>
      <div class="tl-arr">›</div>
    `;
    div.onclick=()=>reopenBilan(b);
    el.appendChild(div);
  });
}

// ── RENDU SECTION RÉÉVALS ──
function renderReevals(){
  const scores=S.currentDocs.filter(d=>d.type==='score_isole');
  document.getElementById('reeval-count').textContent=scores.length+' entrée'+(scores.length>1?'s':'');

  const grid=document.getElementById('reeval-grid');
  // Regrouper les dernières valeurs par score
  const last={};
  // scores est déjà trié DESC donc le premier de chaque type = le plus récent
  scores.forEach(s=>{if(!last[s.scoreType])last[s.scoreType]=s;});

  const SCORE_DEF=[
    {id:'eva',   icon:'😣', label:'EVA',          unit:'/10'},
    {id:'psfs',  icon:'🎯', label:'PSFS',          unit:'/10'},
    {id:'global',icon:'✅', label:'Impression',    unit:'GROC'},
  ];
  grid.innerHTML='';
  SCORE_DEF.forEach(sd=>{
    const last_s=last[sd.id];
    const div=document.createElement('div');
    div.className='reeval-btn';
    div.innerHTML=`
      <div class="reeval-icon">${sd.icon}</div>
      <div class="reeval-lbl">${sd.label}</div>
      <div class="reeval-last">${last_s!==undefined?last_s.value+' '+sd.unit:'—'}</div>
    `;
    div.onclick=()=>{openReeval();openScore(sd.id);};
    grid.appendChild(div);
  });
}

// ══════════════════════════════════════
// ╔══════════════════════════════════╗
// ║   saveBilan() — FONCTION CLEF   ║
// ║   Lie un bilan à un patient     ║
// ╚══════════════════════════════════╝
//
// Cette fonction est exportée globalement pour être appelée
// depuis n'importe quel fichier de bilan (bilan-lombaire-v2.html, etc.)
// via : window.KS.saveBilan(bilanData)
//
// USAGE depuis un bilan :
//   window.KS.saveBilan({
//     bilanType: 'lombaire',          // id du bilan
//     cote: 'gauche',                 // optionnel
//     scores: { EVA: 6, ODI: 42 },    // scores calculés
//     formData: { ... }               // toutes les données du formulaire
//   })
//
// STRUCTURE FIRESTORE RÉSULTANTE :
//   therapists/{uid}/patients/{patientId}/data/{docId}
//   {
//     type: 'bilan_complet',
//     bilanType: 'lombaire',
//     cote: 'gauche',
//     scores: { EVA: 6, ODI: 42 },
//     formData: { ... },
//     timestamp: Timestamp,
//     patientId: '...',
//     therapistUid: '...'
//   }
// ══════════════════════════════════════
window.KS={};
window.KS.saveBilan=async function(bilanData){
  const {patientId,uid}=getContextFromURL();
  if(!patientId||!uid){
    console.error('[KS.saveBilan] Contexte manquant : patientId ou uid absent de lURL');
    return{ok:false,error:'context_missing'};
  }
  try{
    const docId='bilan_'+Date.now();
    const payload={
      type:'bilan_complet',
      bilanType:bilanData.bilanType||'inconnu',
      cote:bilanData.cote||null,
      scores:bilanData.scores||{},
      formData:bilanData.formData||{},
      timestamp:serverTimestamp(),
      patientId,
      therapistUid:uid,
    };
    await setDoc(doc(db,'therapists',uid,'patients',patientId,'data',docId),payload);
    // Màj du timestamp du dernier bilan sur la fiche patient (pour l'affichage dans la liste)
    await updateDoc(doc(db,'therapists',uid,'patients',patientId),{_lastBilanDate:serverTimestamp()});
    console.log('[KS.saveBilan] OK →',docId);
    return{ok:true,docId};
  }catch(e){
    console.error('[KS.saveBilan] ERREUR',e);
    return{ok:false,error:e.message};
  }
};

// ── Lecture du contexte patient depuis l'URL ──
// Les bilans sont ouverts avec ?patientId=xxx&uid=xxx en param
function getContextFromURL(){
  const p=new URLSearchParams(window.location.search);
  return{patientId:p.get('patientId'),uid:p.get('uid')};
}

// ── Réouvrir un bilan existant (pré-remplissage) ──
function reopenBilan(b){
  const bi=BILANS.find(x=>x.id===b.bilanType);
  if(!bi){showToast('Bilan non reconnu');return;}
  const url=bi.url+'?patientId='+S.currentPatient.id+'&uid='+S.uid+'&docId='+b.docId;
  sessionStorage.setItem('ks-reopen-'+b.docId,JSON.stringify(b.formData||{}));
  window.location.href=url;
}

// ══════════════════════════════════════
// NOUVEAU BILAN (depuis profil)
// ══════════════════════════════════════
window.openNewBilan=()=>{
  if(!S.currentPatient)return;
  // Remplir la liste des bilans dans le modal
  const list=document.getElementById('bilans-choice-list');
  list.innerHTML='';
  BILANS.forEach(b=>{
    const btn=document.createElement('button');
    btn.className='bilan-opt';
    btn.innerHTML=`<span class="bilan-dot-sm" style="background:${b.bg}">${b.icon}</span><div><div class="bilan-opt-name">${b.name}</div><div class="bilan-opt-sub">${b.sub}</div></div>`;
    btn.onclick=()=>launchBilan(b);
    list.appendChild(btn);
  });
  openModal('ov-bilan');
};

function launchBilan(b){
  closeModal('ov-bilan');
  const p=S.currentPatient;
  // Pré-remplissage : on passe les données patient en query params ET en sessionStorage
  const ctx={
    patientId:p.id,uid:S.uid,
    prenom:p.prenom,nom:p.nom,ddn:p.ddn,
  };
  sessionStorage.setItem('ks-bilan-ctx',JSON.stringify(ctx));
  const url=b.url+'?patientId='+p.id+'&uid='+S.uid;
  window.location.href=url;
}

// ══════════════════════════════════════
// RÉÉVALUATION RAPIDE — saveScore()
// ══════════════════════════════════════
window.openReeval=()=>{
  if(!S.currentPatient)return;
  // Reset l'état du modal
  document.getElementById('reeval-choice').style.display='block';
  document.getElementById('reeval-eva').style.display='none';
  document.getElementById('reeval-psfs').style.display='none';
  document.getElementById('reeval-global').style.display='none';
  document.getElementById('eva-range').value=5;
  document.getElementById('eva-val').textContent='5';
  S.grocVal=null;
  openModal('ov-reeval');
};

window.openScore=type=>{
  document.getElementById('reeval-choice').style.display='none';
  if(type==='eva'){
    document.getElementById('reeval-eva').style.display='block';
  }else if(type==='psfs'){
    // Récupérer les activités PSFS existantes si dispo
    const prev=S.currentDocs.find(d=>d.type==='score_isole'&&d.scoreType==='psfs');
    const acts=prev?.activities||['Activité 1','Activité 2','Activité 3'];
    const el=document.getElementById('psfs-items');
    el.innerHTML='';
    acts.slice(0,3).forEach((act,i)=>{
      const lastVal=prev?.scores?.[i]||5;
      el.innerHTML+=`<div class="psfs-item">
        <div class="psfs-item-lbl">${act}</div>
        <div class="psfs-chips" id="psfs-chips-${i}">
          ${[...Array(11)].map((_,n)=>`<button class="psfs-chip${n===lastVal?' sel':''}" onclick="selPsfs(${i},${n})">${n}</button>`).join('')}
        </div>
      </div>`;
    });
    document.getElementById('reeval-psfs').style.display='block';
  }else if(type==='global'){
    document.getElementById('reeval-global').style.display='block';
  }
};

window.selPsfs=(row,val)=>{
  document.querySelectorAll(`#psfs-chips-${row} .psfs-chip`).forEach((c,i)=>c.classList.toggle('sel',i===val));
};
window.selGroc=val=>{
  S.grocVal=val;
  document.querySelectorAll('#groc-choices .bilan-opt').forEach(b=>{
    const active=parseInt(b.dataset.v)===val;
    b.style.borderColor=active?'var(--acc)':'var(--brd)';
    b.style.background=active?'rgba(45,212,191,.1)':'';
  });
  // Sauvegarder directement au clic
  setTimeout(()=>saveScore('global'),300);
};

window.saveScore=async type=>{
  if(!S.currentPatient){return;}
  try{
    let payload={
      type:'score_isole',
      scoreType:type,
      timestamp:serverTimestamp(),
      patientId:S.currentPatient.id,
      therapistUid:S.uid,
    };
    if(type==='eva'){
      const val=parseFloat(document.getElementById('eva-range').value);
      payload.value=val;
      payload.label='EVA Douleur';
    }else if(type==='psfs'){
      const scores=[0,1,2].map(i=>{
        const sel=document.querySelector(`#psfs-chips-${i} .psfs-chip.sel`);
        return sel?parseInt(sel.textContent):5;
      });
      const mean=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*10)/10;
      payload.value=mean;payload.scores=scores;payload.label='PSFS';
    }else if(type==='global'){
      if(S.grocVal===null){showToast('Sélectionnez une option');return;}
      payload.value=S.grocVal;payload.label='GROC';
    }
    const docId='score_'+Date.now();
    await setDoc(dataDoc(S.currentPatient.id,docId),payload);
    closeModal('ov-reeval');
    showToast('Score enregistré ✓');
    await loadPatientDocs(S.currentPatient.id);
  }catch(e){
    console.error('[saveScore]',e);
    showToast('Erreur : '+e.message);
  }
};

// ── Navigation ──
window.goBack=()=>{S.currentPatient=null;ss('sc-list');};

// ══════════════════════════════════════
// CHARGEMENT INITIAL
// ══════════════════════════════════════
async function loadPatients(){
  try{
    const snap=await getDocs(patientsCol());
    S.allPatients=[];
    snap.forEach(d=>S.allPatients.push({id:d.id,...d.data()}));
    // Tri alpha par nom
    S.allPatients.sort((a,b)=>(a.nom||'').localeCompare(b.nom||'','fr'));
    S.filtered=[...S.allPatients];
    renderList();
  }catch(e){
    console.error('[loadPatients]',e);
    showToast('Erreur de chargement des patients');
  }
}

// ── INIT FIREBASE AUTH ──
onAuthStateChanged(auth,async user=>{
  hideLoad();
  if(user&&!user.isAnonymous){
    S.uid=user.uid;
    // Charger le profil kiné
    try{
      const snap=await getDoc(doc(db,'therapists',user.uid));
      if(snap.exists())S.therapist={uid:user.uid,...snap.data()};
    }catch(e){}
    // Vérifier si on arrive depuis un bilan (retour avec patientId)
    const params=new URLSearchParams(window.location.search);
    const retPat=params.get('patientId');
    await loadPatients();
    ss('sc-list');
    if(retPat){
      const p=S.allPatients.find(x=>x.id===retPat);
      if(p)openProfil(retPat);
    }
  }else{
    // Fallback : connexion anonyme puis redirection
    try{await signInAnonymously(auth);}
    catch(e){}
    window.location.href='index.html';
  }
});

// ── Tap feedback tactile (iOS) ──
(function(){
  const sel=['.pat-card','.btn-add','.btn-action','.bilan-opt','.reeval-btn','.tl-item','.psfs-chip','.pinkey','.btn-p','.btn-s'];
  function addTap(el){
    if(el._tap)return;el._tap=true;
    el.addEventListener('touchstart',()=>{el.style.opacity='.75';if(navigator.vibrate)navigator.vibrate(6);},{passive:true});
    el.addEventListener('touchend',()=>{setTimeout(()=>el.style.opacity='',150);},{passive:true});
  }
  const obs=new MutationObserver(()=>sel.forEach(s=>document.querySelectorAll(s).forEach(addTap)));
  obs.observe(document.body,{childList:true,subtree:true});
  sel.forEach(s=>document.querySelectorAll(s).forEach(addTap));
})();
</script>
